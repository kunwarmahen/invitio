# Asustor NAS deployment — Asustor reverse proxy terminates SSL (ports 80/443),
# this stack listens on localhost:18080 (HTTP). Mirrors the calorieapp setup.
#
# Architecture:
#   Internet → Asustor Reverse Proxy (443, Let's Encrypt) → nginx (localhost:18080) → app:8000
#
# Asustor ADM setup (one-time):
#   1. ADM → Settings → Connection → Reverse Proxy Server → Add:
#        Rule name:    invitio
#        Protocol:     HTTPS
#        Domain name:  invite.mahensingh.ddns.info   (or a path/subdomain you pick)
#        Port:         443
#        Destination:  HTTP  /  127.0.0.1  /  18080
#        Certificate:  your Let's Encrypt cert
#   2. Router port forwarding: 80 → NAS:80, 443 → NAS:443
#
# Required in .env (see .env.example):
#   POSTGRES_PASSWORD=a-strong-password
#   JWT_SECRET_KEY=a-long-random-string
#   PUBLIC_BASE_URL=https://invite.mahensingh.ddns.info
#   ALLOWED_ORIGINS=["https://invite.mahensingh.ddns.info"]
#   GMAIL_ADDRESS / GMAIL_APP_PASSWORD  (optional — enables emailing invites)
#
# Deploy:  ./deploy.sh nas deploy

services:
  app:
    image: invitio:latest        # loaded via deploy.sh — never built on the NAS
    env_file: .env
    environment:
      - DATABASE_PROVIDER=postgres
      - DATABASE_URL=postgresql+asyncpg://invitio:${POSTGRES_PASSWORD}@db:5432/invitio
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads   # uploaded invite images survive container/image churn
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18080:80"     # localhost only — Asustor reverse proxy forwards here
    volumes:
      - ./nginx/nginx-nossl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invitio
      POSTGRES_USER: invitio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data   # bind mount → survives Docker reinstalls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitio"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
