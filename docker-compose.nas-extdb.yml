# Asustor NAS deployment — variant that REUSES AN EXISTING PostgreSQL instance
# instead of bundling its own postgres container. Used by `./deploy.sh nas deploy`
# when you choose "reuse an existing instance" (or set NAS_DB_MODE=existing).
#
# This stack runs only app + nginx — no `db` service. The database connection
# comes from DATABASE_URL in .env, which deploy.sh fills in from the connection
# details you provide (host/port/name/user/password).
#
# The target Postgres must be reachable from the app container. Either:
#   • a host/LAN address (e.g. 192.168.1.50:5432) — works out of the box, or
#   • another Docker container on a shared user-defined network — set
#     NAS_DB_NETWORK to that network's name and deploy.sh ships an override
#     (docker-compose.override.yml) that attaches the app to it, so the host you
#     give can be the DB container/service name.
#
# Create the database + user before deploying, e.g.:
#   CREATE USER invitio WITH PASSWORD '...';
#   CREATE DATABASE invitio OWNER invitio;
#
# For the bundled-postgres variant and the one-time Asustor reverse-proxy setup,
# see docker-compose.nas.yml.

services:
  app:
    image: invitio:latest        # loaded via deploy.sh — never built on the NAS
    env_file: .env               # supplies DATABASE_URL for the external Postgres
    environment:
      - DATABASE_PROVIDER=postgres
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./uploads:/app/uploads   # uploaded invite images survive container/image churn
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      # localhost only — Asustor reverse proxy forwards here. Override the port via
      # INVITIO_HTTP_PORT in .env when 18080 is taken (e.g. by another app's nginx).
      - "127.0.0.1:${INVITIO_HTTP_PORT:-18080}:80"
    volumes:
      - ./nginx/nginx-nossl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
